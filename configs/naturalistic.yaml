# Naturalistic robust recipe (the report's KLDrop). Frozen encoders; each batch
# pairs a clean view with an on-the-fly perturbed view under the consistency
# loss BCE_clean + alpha*BCE_pert + beta*KL_full + gamma*KL_image, plus
# per-example text-modality dropout that forces a real image-only prediction.
seed: 0

model:
  arch: ViT-B-32
  pretrained: laion2b_s34b_b79k
  freeze_encoders: true
  modality: multimodal
  head_hidden: 512
  head_dropout: 0.2

data:
  dataset_root: data/hateful_memes
  train_split_file: data/processed/splits/train_split.json
  val_split: dev
  num_workers: 8

train:
  batch_size: 128
  epochs: 10
  lr_head: 1.0e-3
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  early_stop_patience: 3
  pos_weight_auto: true
  select_metric: clean_macro_f1

robust:
  clean_weight: 1.0
  naturalistic:
    enabled: true
    alpha: 1.0
    beta: 0.5
    gamma: 0.25
    modality_dropout_text: 0.30        # KLDrop; report's default sweet spot is 0.15-0.30
    text_fraction: 0.5
    image_fraction: 0.3
    both_fraction: 0.2
    text_attacks:  [leetspeak, char_deletion, char_swap, censoring, keyboard_typo]
    image_attacks: [gaussian_noise, blur, compression, brightness_down, occlusion, typographic]
    severity_weights_text:  [1, 2, 2]  # bias toward higher-severity text (text edits dominate)
    severity_weights_image: [1, 1, 1]
    augmenter_seed: 0
  adversarial:
    enabled: false
