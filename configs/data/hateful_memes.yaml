dataset:
  name: hateful_memes
  # Path inside a Run:AI job. The course staff staged the dataset on the group
  # scratch volume; verified end-to-end on 2026-05-02.
  cluster_root: /scratch/datasets/hate_meta
  # Local path is intentionally empty: the dataset is not redistributed to
  # laptops. Track A (synthetic smoke) does not need it.
  local_root: data/raw/data
  splits:
    train: train.jsonl       # 8500 rows, all labeled (3050 / 5450)
    dev: dev.jsonl           #  500 rows, all labeled (250 / 250)
    test: test.jsonl         # 1000 rows, UNLABELED
  label_mapping:
    0: not_hateful
    1: hateful
  # Deterministic 8000/500 partition of train.jsonl produced once with seed 0
  # by scripts/make_train_split.py and committed under data/processed/splits/.
  train_split_file: data/processed/splits/train_split.json

dataloader:
  batch_size: 128
  num_workers: 8
  image_size: 224
