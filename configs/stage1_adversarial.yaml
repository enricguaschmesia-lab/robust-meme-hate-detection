seed: 0

model:
  arch: ViT-B-32
  pretrained: laion2b_s34b_b79k
  freeze_encoders: false
  freeze_image_encoder: false
  freeze_text_encoder: true
  head_hidden: 512
  head_dropout: 0.2

data:
  # Path visible from the environment where you run training (jumphost or cluster).
  dataset_root: /scratch/datasets/hate_meta
  # Optional: path to a JSON split file to restrict the training set.
  # train_split_file: /path/to/train_split.json
  val_split: dev
  num_workers: 8

train:
  batch_size: 64
  epochs: 40
  lr_head: 1.0e-4
  lr_vis: 1.0e-6
  weight_decay: 1.0e-2
  warmup_ratio: 0.1
  amp_dtype: bfloat16
  early_stop_patience: 100
  early_stop_metric: macro_f1
  pos_weight_auto: true
  adv_training_type: hybrid
  alpha: 0.5

robust:
  attack_settings:
    - epsilon_over_255: 1
      pgd_steps: 25
      pgd_alpha_frac: 0.25
    - epsilon_over_255: 2
      pgd_steps: 25
      pgd_alpha_frac: 0.25
    - epsilon_over_255: 4
      pgd_steps: 25
      pgd_alpha_frac: 0.25
    - epsilon_over_255: 8
      pgd_steps: 25
      pgd_alpha_frac: 0.25
    - epsilon_over_255: 12
      pgd_steps: 25
      pgd_alpha_frac: 0.25
