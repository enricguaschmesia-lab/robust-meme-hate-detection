<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 1410 620"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1410" height="620" fill="#ffffff"/>

  <style>
    .head { font-size: 22px; font-weight: 700; fill: #ffffff; }
    .mod { font-size: 18px; font-weight: 700; fill: #143264; }
    .atk { font-size: 18px; font-weight: 700; fill: #262626; }
    .def { font-size: 18px; fill: #262626; }
    .muted { fill: #595959; }
  </style>

  <!-- Single compact table: all naturalistic perturbations -->
  <rect x="18" y="18" width="1374" height="584" fill="#ffffff" stroke="#8f8f8f" stroke-width="2"/>
  <rect x="18" y="18" width="1374" height="42" fill="#143264"/>

  <text x="44" y="46" class="head">Modality</text>
  <text x="190" y="46" class="head">Perturbation</text>
  <text x="488" y="46" class="head">Definition</text>

  <line x1="160" y1="18" x2="160" y2="602" stroke="#b7b7b7" stroke-width="1.5"/>
  <line x1="458" y1="18" x2="458" y2="602" stroke="#b7b7b7" stroke-width="1.5"/>

  <!-- alternating row backgrounds -->
  <g fill="#f7f9fc">
    <rect x="18" y="60" width="1374" height="28"/>
    <rect x="18" y="116" width="1374" height="28"/>
    <rect x="18" y="172" width="1374" height="28"/>
    <rect x="18" y="228" width="1374" height="28"/>
    <rect x="18" y="284" width="1374" height="28"/>
    <rect x="18" y="340" width="1374" height="28"/>
    <rect x="18" y="396" width="1374" height="28"/>
    <rect x="18" y="452" width="1374" height="28"/>
    <rect x="18" y="508" width="1374" height="28"/>
    <rect x="18" y="564" width="1374" height="38"/>
  </g>

  <!-- subtle row rules -->
  <g stroke="#d6d6d6" stroke-width="1">
    <line x1="18" y1="88" x2="1392" y2="88"/>
    <line x1="18" y1="116" x2="1392" y2="116"/>
    <line x1="18" y1="144" x2="1392" y2="144"/>
    <line x1="18" y1="172" x2="1392" y2="172"/>
    <line x1="18" y1="200" x2="1392" y2="200"/>
    <line x1="18" y1="228" x2="1392" y2="228"/>
    <line x1="18" y1="256" x2="1392" y2="256"/>
    <line x1="18" y1="284" x2="1392" y2="284"/>
    <line x1="18" y1="312" x2="1392" y2="312"/>
    <line x1="18" y1="340" x2="1392" y2="340"/>
    <line x1="18" y1="368" x2="1392" y2="368"/>
    <line x1="18" y1="396" x2="1392" y2="396"/>
    <line x1="18" y1="424" x2="1392" y2="424"/>
    <line x1="18" y1="452" x2="1392" y2="452"/>
    <line x1="18" y1="480" x2="1392" y2="480"/>
    <line x1="18" y1="508" x2="1392" y2="508"/>
    <line x1="18" y1="536" x2="1392" y2="536"/>
    <line x1="18" y1="564" x2="1392" y2="564"/>
  </g>

  <!-- modality group labels -->
  <text x="44" y="174" class="mod">Text</text>
  <text x="44" y="434" class="mod">Image</text>
  <line x1="18" y1="284" x2="1392" y2="284" stroke="#8f8f8f" stroke-width="2"/>

  <!-- text perturbations -->
  <g>
    <text x="190" y="80" class="atk">leetspeak</text>
    <text x="488" y="80" class="def">Replace letters with look-alike symbols or digits <tspan class="muted">(a-&gt;@/4, e-&gt;3, s-&gt;$/5)</tspan>.</text>

    <text x="190" y="108" class="atk">char_deletion</text>
    <text x="488" y="108" class="def">Delete sampled characters while preserving at least half of the caption.</text>

    <text x="190" y="136" class="atk">char_swap</text>
    <text x="488" y="136" class="def">Swap disjoint adjacent character pairs; severity controls number of swaps.</text>

    <text x="190" y="164" class="atk">spacing</text>
    <text x="488" y="164" class="def">Insert or remove spaces to split words, pad words, or collapse words.</text>

    <text x="190" y="192" class="atk">punctuation</text>
    <text x="488" y="192" class="def">Insert punctuation marks into random positions in the caption.</text>

    <text x="190" y="220" class="atk">case_noise</text>
    <text x="488" y="220" class="def">Randomly flip letter case to test tokenization sensitivity.</text>

    <text x="190" y="248" class="atk">censoring</text>
    <text x="488" y="248" class="def">Replace sampled alphanumeric characters with asterisks.</text>

    <text x="190" y="276" class="atk">keyboard_typo</text>
    <text x="488" y="276" class="def">Substitute letters with nearby QWERTY keys; case is preserved.</text>
  </g>

  <!-- image perturbations -->
  <g>
    <text x="190" y="304" class="atk">gaussian_noise</text>
    <text x="488" y="304" class="def">Add zero-mean Gaussian pixel noise.</text>

    <text x="190" y="332" class="atk">blur</text>
    <text x="488" y="332" class="def">Apply Gaussian blur with radius increasing by severity.</text>

    <text x="190" y="360" class="atk">compression</text>
    <text x="488" y="360" class="def">Re-encode as JPEG with lower quality at higher severity.</text>

    <text x="190" y="388" class="atk">brightness_up</text>
    <text x="488" y="388" class="def">Increase brightness by a fixed direction and severity.</text>

    <text x="190" y="416" class="atk">brightness_down</text>
    <text x="488" y="416" class="def">Decrease brightness by a fixed direction and severity.</text>

    <text x="190" y="444" class="atk">contrast_up</text>
    <text x="488" y="444" class="def">Increase contrast by a fixed direction and severity.</text>

    <text x="190" y="472" class="atk">contrast_down</text>
    <text x="488" y="472" class="def">Decrease contrast by a fixed direction and severity.</text>

    <text x="190" y="500" class="atk">translation</text>
    <text x="488" y="500" class="def">Shift the image on the canvas and fill uncovered pixels with gray.</text>

    <text x="190" y="528" class="atk">crop</text>
    <text x="488" y="528" class="def">Randomly crop image edges, then resize back to 224×224.</text>

    <text x="190" y="556" class="atk">occlusion</text>
    <text x="488" y="556" class="def">Overlay one to three gray square masks on random regions.</text>

    <text x="190" y="586" class="atk">typographic</text>
    <text x="488" y="586" class="def">Render high-contrast text overlays such as "SAFE" or "NOT HATEFUL".</text>
  </g>
</svg>
