<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">CLIP fusion architecture for hateful meme detection</title>
  <desc id="desc">A dual-encoder OpenCLIP ViT-B/32 model with image and text branches, interaction-feature fusion, and a trainable MLP classifier head.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#27364a"/>
    </marker>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d6dce7; stroke-width: 2; rx: 8; }
      .box { fill: #ffffff; stroke: #27364a; stroke-width: 2; rx: 8; }
      .input { fill: #edf6ff; }
      .pre { fill: #eefaf3; }
      .frozen { fill: #f5f2ff; }
      .train { fill: #fff5e8; }
      .output { fill: #ffeef1; }
      .label { font: 700 30px Arial, sans-serif; fill: #182233; }
      .group { font: 700 21px Arial, sans-serif; fill: #4a5870; }
      .text { font: 600 20px Arial, sans-serif; fill: #182233; }
      .small { font: 16px Arial, sans-serif; fill: #526177; }
      .tiny { font: 14px Arial, sans-serif; fill: #526177; }
      .arrow { stroke: #27364a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="470"/>

  <rect class="panel" x="52" y="20" width="210" height="432"/>
  <text class="group" x="157" y="50" text-anchor="middle">Inputs</text>

  <rect class="box input" x="82" y="80" width="150" height="90"/>
  <text class="text" x="157" y="113" text-anchor="middle">Image</text>
  <text class="small" x="157" y="138" text-anchor="middle">RGB image</text>
  <text class="small" x="157" y="159" text-anchor="middle">resize to 224×224</text>

  <rect class="box input" x="82" y="300" width="150" height="90"/>
  <text class="text" x="157" y="334" text-anchor="middle">Meme text</text>
  <text class="small" x="157" y="360" text-anchor="middle">provided text field</text>

  <rect class="panel" x="308" y="20" width="230" height="432"/>
  <text class="group" x="423" y="50" text-anchor="middle">Preprocessing</text>

  <rect class="box pre" x="340" y="80" width="166" height="90"/>
  <text class="text" x="423" y="111" text-anchor="middle">CLIP resize +</text>
  <text class="small" x="423" y="136" text-anchor="middle">normalize</text>
  <text class="small" x="423" y="157" text-anchor="middle">inside model</text>

  <rect class="box pre" x="340" y="300" width="166" height="90"/>
  <text class="text" x="423" y="331" text-anchor="middle">Tokenizer</text>
  <text class="small" x="423" y="356" text-anchor="middle">OpenCLIP ids</text>
  <text class="small" x="423" y="377" text-anchor="middle">B x 77</text>

  <rect class="box pre" x="292" y="195" width="262" height="82"/>
  <text class="text" x="423" y="224" text-anchor="middle">Optional perturbations</text>
  <text class="small" x="423" y="249" text-anchor="middle">text: leetspeak, typos, spacing</text>
  <text class="small" x="423" y="270" text-anchor="middle">image: blur, noise, JPEG</text>

  <rect class="panel" x="584" y="20" width="252" height="432"/>
  <text class="group" x="710" y="50" text-anchor="middle">OpenCLIP Backbone</text>
  <text class="tiny" x="710" y="72" text-anchor="middle">frozen by default in Stage 1</text>

  <rect class="box frozen" x="618" y="80" width="184" height="90"/>
  <text class="text" x="710" y="110" text-anchor="middle">encode_image</text>
  <text class="small" x="710" y="135" text-anchor="middle">ViT-B/32 visual</text>
  <text class="small" x="710" y="156" text-anchor="middle">v in R^512</text>

  <rect class="box frozen" x="618" y="300" width="184" height="90"/>
  <text class="text" x="710" y="330" text-anchor="middle">encode_text</text>
  <text class="small" x="710" y="355" text-anchor="middle">CLIP text transformer</text>
  <text class="small" x="710" y="376" text-anchor="middle">t in R^512</text>

  <rect class="panel" x="882" y="20" width="252" height="432"/>
  <text class="group" x="1008" y="50" text-anchor="middle">Trainable Fusion Head</text>

  <rect class="box train" x="914" y="124" width="188" height="106"/>
  <text class="text" x="1008" y="154" text-anchor="middle">Interaction fusion</text>
  <text class="small" x="1008" y="179" text-anchor="middle">concat(t, v,</text>
  <text class="small" x="1008" y="200" text-anchor="middle">abs(t - v), t * v)</text>
  <text class="small" x="1008" y="221" text-anchor="middle">B x 2048</text>

  <rect class="box train" x="914" y="260" width="188" height="126"/>
  <text class="text" x="1008" y="291" text-anchor="middle">Classifier MLP</text>
  <text class="small" x="1008" y="316" text-anchor="middle">LayerNorm 2048</text>
  <text class="small" x="1008" y="337" text-anchor="middle">Linear 2048 -> 512</text>
  <text class="small" x="1008" y="358" text-anchor="middle">GELU, dropout</text>
  <text class="small" x="1008" y="379" text-anchor="middle">Linear 512 -> 1</text>

  <rect class="panel" x="1138" y="130" width="106" height="162"/>
  <text class="group" x="1191" y="160" text-anchor="middle">Output</text>
  <rect class="box output" x="1147" y="182" width="88" height="72"/>
  <text class="small" x="1191" y="212" text-anchor="middle">p(hateful)</text>
  <text class="tiny" x="1191" y="236" text-anchor="middle">binary output</text>
  <text class="tiny" x="1191" y="276" text-anchor="middle">sigmoid</text>

  <path class="arrow dash" d="M423 195 V170"/>
  <path class="arrow" d="M232 125 H340"/>
  <path class="arrow" d="M506 125 H618"/>
  <path class="arrow dash" d="M423 277 V300"/>
  <path class="arrow" d="M232 345 H340"/>
  <path class="arrow" d="M506 345 H618"/>
  <path class="arrow" d="M802 125 H862 V174 H914"/>
  <path class="arrow" d="M802 345 H862 V202 H914"/>
  <path class="arrow" d="M1008 230 V260"/>
  <path class="arrow" d="M1102 323 H1130 V218 H1147"/>

  <text class="tiny" x="1008" y="412" text-anchor="middle">Ablations: zero text or image</text>
  <text class="tiny" x="1008" y="432" text-anchor="middle">embedding before fusion</text>
</svg>
