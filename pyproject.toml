[project]
name = "robust-meme-hate-detection"
version = "1.0.0"
description = "Robustness of CLIP-fusion hateful-meme classifiers under naturalistic and adversarial perturbations (EE-559, Group 49)."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch>=2.24",
    "Pillow",
    "numpy",
    "scikit-learn",
    "PyYAML",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
